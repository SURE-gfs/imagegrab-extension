<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>图片画廊 · 图提取 ImageGrab</title><link rel="stylesheet" href="gallery.css"></head><body>
<header><a class="brand" href="popup.html"><span>▧</span> 图提取 <small>ImageGrab</small></a><span class="local">● 本地处理 · PNG 原尺寸导出</span></header>
<main><div class="eyebrow">YOUR PRODUCT, EVERY DETAIL.</div><section class="intro"><div><h1>好图片，一张都不错过。</h1><p id="source">正在读取提取结果…</p></div><div class="stat"><strong id="count">0</strong><span>张有效图片</span></div></section>
<div class="toolbar"><div class="tools"><button id="select-all">全选</button><button id="invert">反选</button><label>最小尺寸 <select id="size"><option value="100">100 × 100</option><option value="300">300 × 300</option><option value="600">600 × 600</option></select></label></div><div class="tools"><span>已选 <b id="selected">0</b> 张</span><button class="primary" id="download" disabled>↓ 下载选中 PNG</button></div></div>
<div class="progress-area" aria-live="polite"><span id="status">正在加载图片…</span><progress id="progress" value="0" max="1" hidden></progress></div><section id="grid" aria-label="图片预览列表"></section><div id="empty" hidden>没有符合条件的图片。请先向下滚动商品详情页，等待图片加载后重新提取。</div><section id="errors" hidden><h2>下载未完成的图片</h2><ul id="error-list"></ul><p>已下载成功的图片会取消勾选，可再次点击按钮重试剩余图片。</p></section>
<footer>图提取 ImageGrab · 只处理你主动提取的图片<br>下载位置：浏览器默认下载目录 / ImageGrab　·　请仅下载你有权使用的图片</footer></main><script src="gallery.js"></script></body></html>
